bundle:
  name: refinery

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for all layers
  schema_prefix:
    description: Prefix for schema names, empty in DEV and "refinery_" in PROD
    default: ""
  prod_service_principal:
    description: Application ID of refinery-prod-ci, the identity that deploys and runs PROD
    default: ""
  warehouse_id:
    description: SQL warehouse for alerts
    default: ""
  alert_email:
    description: Email that receives monitoring alerts
    default: ""
  operator_user:
    description: PROD workspace user who operates live resources (start and stop the live pipeline)
    default: ""

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-72291aa5-f437.cloud.databricks.com
    variables:
      catalog: refinery_dev

  prod:
    mode: production
    workspace:
      host: https://adb-7405604651938730.10.azuredatabricks.net
      root_path: /Workspace/Users/${var.prod_service_principal}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.prod_service_principal}
    variables:
      catalog: dbr_dev_ua5816bd
      schema_prefix: refinery_
      prod_service_principal: 1f13aa19-fd45-453f-953b-bf15bf389d48
      warehouse_id:
        lookup:
          warehouse: Serverless Starter Warehouse
      alert_email: roksolana.shendiu770@softserve.academy
      operator_user: roksolana.shendiu770@softserve.academy

