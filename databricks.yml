bundle:
  name: refinery

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for all layers
  schema_prefix:
    description: Prefix for schema names, empty in DEV and "refinery_" in PROD
    default: ""
  prod_service_principal:
    description: Application ID of refinery-prod-ci, the identity that deploys and runs PROD
    default: ""

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-72291aa5-f437.cloud.databricks.com
    variables:
      catalog: refinery_dev

  prod:
    mode: production
    workspace:
      host: https://adb-7405604651938730.10.azuredatabricks.net
      root_path: /Workspace/Users/${var.prod_service_principal}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.prod_service_principal}
    variables:
      catalog: dbr_dev_ua5816bd
      schema_prefix: refinery_
      prod_service_principal: <refinery-prod-ci-application-id>
