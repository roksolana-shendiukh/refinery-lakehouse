bundle:
  name: refinery

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for all layers
  schema_prefix:
    description: Prefix for schema names, empty in DEV and "refinery_" in PROD
    default: ""
  prod_service_principal:
    description: Application ID of refinery-prod-ci, the identity that deploys and runs PROD
    default: ""
  warehouse_id:
    description: SQL warehouse for alerts
    default: ""
  alert_email:
    description: Email that receives monitoring alerts
    default: ""
  operator_user:
    description: PROD workspace user who operates live resources (start and stop the live pipeline)
    default: ""
  secret_scope:
    description: Key Vault-backed secret scope with the project's secrets (Key Vault kv-refinery-ua5816b)
    default: ""
  infra_service_principal:
    description: Application ID of refinery-prod-infra (Terraform); creates and owns the tables written outside pipelines
    default: ""
  ais_producer_principal:
    description: Application ID of refinery-ais-producer, which writes the Zerobus landing table
    default: ""
  live_map_principal:
    description: Application ID of the live map app's service principal, which reads the live tables
    default: ""
  assistant_principal:
    description: Application ID of the assistant app's service principal, which queries the index and writes the request log
    default: ""

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-72291aa5-f437.cloud.databricks.com
    variables:
      catalog: refinery_dev
      secret_scope: refinery-kv
      warehouse_id:
        lookup:
          warehouse: Serverless Starter Warehouse

  prod:
    mode: production
    workspace:
      host: https://adb-7405604651938730.10.azuredatabricks.net
      root_path: /Workspace/Users/${var.prod_service_principal}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.prod_service_principal}
    variables:
      catalog: dbr_dev_ua5816bd
      schema_prefix: refinery_
      prod_service_principal: 1f13aa19-fd45-453f-953b-bf15bf389d48
      infra_service_principal: 1ba942f1-5296-4c88-a49e-7fdcb5a4ba83
      ais_producer_principal: a71604c7-86b9-4b15-92a6-e39ad5ca6ad4
      live_map_principal: b4a74449-a72e-435e-bd03-c5468fe61f3a
      assistant_principal: 3b5ff896-8610-4062-b37d-c60179f82362
      warehouse_id:
        lookup:
          warehouse: Serverless Starter Warehouse
      alert_email: roksolana.shendiu770@softserve.academy
      operator_user: roksolana.shendiu770@softserve.academy
      secret_scope: refinery-kv
    resources:
      # Schema grants live here because only the schema owner (refinery-prod-ci, this bundle) can grant on a schema.
      # Bundle grants are authoritative: a schema holds exactly these grants, so every schema-level grant is listed.
      # Table grants are made by Terraform, which owns the tables it creates (infra/grants.tf).
      # Groups are account groups, created once by hand (our service principals cannot create account groups).
      schemas:
        bronze:
          grants:
            - principal: ${var.infra_service_principal}
              privileges: [USE_SCHEMA, CREATE_TABLE]
            - principal: ${var.ais_producer_principal}
              privileges: [USE_SCHEMA]
        silver:
          grants:
            - principal: ${var.infra_service_principal}
              privileges: [USE_SCHEMA, CREATE_TABLE]
        quality:
          grants:
            - principal: ${var.infra_service_principal}
              privileges: [USE_SCHEMA, CREATE_TABLE]
            # The DQ dashboard reads the quality tables with the viewer's rights.
            - principal: refinery_data_engineers
              privileges: [USE_SCHEMA, SELECT]
        # Analysts read gold; the ABAC policies decide which rows and prices each group sees.
        gold:
          grants:
            - principal: refinery_market_analysts
              privileges: [USE_SCHEMA, SELECT]
            - principal: refinery_region_R30
              privileges: [USE_SCHEMA, SELECT]
        # Coastal operations get no grants here: the live map app reads the live tables as its own
        # service principal, and access to the app goes through the refinery_coastal_operations group
        # (resources/streaming.yml).
        live:
          grants:
            - principal: ${var.live_map_principal}
              privileges: [USE_SCHEMA, SELECT]
        rag:
          grants:
            - principal: ${var.infra_service_principal}
              privileges: [USE_SCHEMA, CREATE_TABLE]
              # The assistant app works as its own service principal: SELECT on the index comes from
              # refinery-rag-search-start (the index is recreated on every start), MODIFY on the request log from Terraform.
            - principal: ${var.assistant_principal}
              privileges: [ USE_SCHEMA ]
