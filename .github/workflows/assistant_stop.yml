name: assistant-stop

# Manual only: stops the assistant app, then deletes the vector search index and endpoint,
# so the assistant costs nothing until the next assistant-start.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant
  cancel-in-progress: false

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
    steps:
      - uses: actions/checkout@v7

      # The jobs install dist/*.whl; build it as deploy-prod does, so the bundle resolves the same files
      - name: Build the wheel
        uses: ./.github/actions/build-wheel

      - uses: ./.github/actions/setup-databricks-cli
        with:
          version: 0.296.1

      # First the app, so it is no longer running when the index disappears
      - name: Stop the assistant app
        run: |
          app_name=$(databricks bundle summary -t prod -o json | jq -r '.resources.apps.assistant.name')
          echo "Stopping app: $app_name"
          # Inside the bundle folder the CLI picks the workspace from a bundle target:
          # without -t prod it would use the default target (dev).
          databricks apps stop "$app_name" -t prod

      # Even if stopping the app failed: the endpoint is the larger cost
      - name: Delete vector search
        if: ${{ !cancelled() }}
        run: databricks bundle run -t prod rag_search_stop
