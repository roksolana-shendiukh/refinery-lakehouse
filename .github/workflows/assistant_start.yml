name: assistant-start

# Manual only: creates the vector search endpoint and index for the RAG assistant, syncs the index with
# the article chunks, then deploys the latest assistant app code from main and starts the app.
# Takes about 30 minutes.
# Vector search and the app are billed by the hour until assistant-stop is run.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    environment: prod
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
    steps:
      - uses: actions/checkout@v7

      # The jobs install dist/*.whl; build it as deploy-prod does, so the bundle resolves the same files
      - name: Build the wheel
        uses: ./.github/actions/build-wheel

      - uses: ./.github/actions/setup-databricks-cli
        with:
          version: 0.296.1

      - name: Create and sync Vector Search
        run: databricks bundle run -t prod rag_search_start

      - name: Deploy the app code and start the assistant
        run: databricks bundle run -t prod assistant
