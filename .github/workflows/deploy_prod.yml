name: deploy-prod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-databricks-cli
        with:
          version: 0.296.1

      - name: Validate the bundle for PROD
        run: databricks bundle validate -t prod

      - name: Show planned changes
        run: |
          for attempt in 1 2 3; do
            databricks bundle plan -t prod && exit 0
            echo "bundle plan failed (attempt $attempt of 3), retrying in 30 s"
            sleep 30
          done
          exit 1

      - name: Deploy the bundle to PROD
        run: databricks bundle deploy -t prod
