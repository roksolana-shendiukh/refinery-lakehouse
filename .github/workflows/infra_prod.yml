name: infra-prod

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra_prod.yml"
      - ".github/actions/terraform-provider-mirror/**"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra_prod.yml"
      - ".github/actions/terraform-provider-mirror/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-prod
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.13"

      # Provider from a mirror downloaded through the GitHub API (github.com release URLs may time out).
      - uses: ./.github/actions/terraform-provider-mirror

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without state
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  apply:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    defaults:
      run:
        working-directory: infra
    # Terraform runs as refinery-prod-infra, not as refinery-prod-ci (the bundle deployer):
    # only this identity may create the landing table and grant rights.
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_INFRA_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_INFRA_CLIENT_SECRET }}
      DATABRICKS_AUTH_TYPE: oauth-m2m
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.13"

      # Provider from a mirror downloaded through the GitHub API (github.com release URLs may time out).
      - uses: ./.github/actions/terraform-provider-mirror

      - name: Initialize with HCP Terraform state
        run: terraform init -input=false

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply the reviewed plan
        run: terraform apply -input=false tfplan
