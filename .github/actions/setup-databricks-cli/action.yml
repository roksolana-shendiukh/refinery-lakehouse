name: Set up Databricks CLI
description: >-
  Provides the Databricks CLI from its official Docker image (ghcr.io/databricks/cli), which includes
  Terraform and the Databricks provider, so bundle commands download nothing from github.com.

inputs:
  version:
    description: Databricks CLI version = image tag, e.g. 0.296.1
    required: true

runs:
  using: composite
  steps:
    - name: Pull the Databricks CLI image and put a databricks wrapper on the PATH
      shell: bash
      env:
        IMAGE: ghcr.io/databricks/cli:${{ inputs.version }}
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          docker pull --quiet "$IMAGE" && break
          [ "$attempt" -eq 3 ] && exit 1
          echo "docker pull failed (attempt $attempt of 3), retrying in 15 s"; sleep 15
        done

        dir="$RUNNER_TEMP/databricks-cli"
        mkdir -p "$dir"
        # The wrapper runs the CLI inside the image, in the current directory, with the Databricks credentials.
        cat > "$dir/databricks" <<EOF
        #!/usr/bin/env bash
        exec docker run --rm -i \
          -v "\$PWD:\$PWD" -w "\$PWD" \
          -e DATABRICKS_HOST -e DATABRICKS_CLIENT_ID -e DATABRICKS_CLIENT_SECRET -e DATABRICKS_AUTH_TYPE \
          "$IMAGE" "\$@"
        EOF
        chmod +x "$dir/databricks"
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/databricks" --version
