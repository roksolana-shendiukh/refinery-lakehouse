name: Set up Databricks CLI
description: >-
  Installs a pinned Databricks CLI release through the GitHub API (works when github.com download
  URLs fail), retries on errors and verifies the published checksum.

inputs:
  version:
    description: Databricks CLI version, e.g. 0.296.1
    required: true
  token:
    description: Token for GitHub API calls (raises the rate limit on shared runners)
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Download, verify and install the Databricks CLI
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        archive="databricks_cli_${VERSION}_linux_amd64.zip"
        sums="databricks_cli_${VERSION}_SHA256SUMS"
        dir="$RUNNER_TEMP/databricks-cli"
        mkdir -p "$dir" && cd "$dir"
        retry=(--retry 5 --retry-all-errors --retry-delay 10)

        # The release's file list comes from the GitHub API, not from github.com pages.
        release=$(curl -fsSL "${retry[@]}" -H "Authorization: Bearer $GH_TOKEN" \
          "https://api.github.com/repos/databricks/cli/releases/tags/v${VERSION}")

        download() {
          local url
          url=$(jq -r --arg name "$1" '.assets[] | select(.name == $name) | .url' <<< "$release")
          [ -n "$url" ] || { echo "Asset $1 not found in release v${VERSION}"; exit 1; }
          curl -fsSL "${retry[@]}" -o "$1" \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$url"
        }
        download "$archive"
        download "$sums"

        # Install only what matches the published checksum.
        grep " ${archive}\$" "$sums" | sha256sum --check -
        unzip -q -o "$archive"
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/databricks" --version
