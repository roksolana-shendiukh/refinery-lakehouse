[project]
name = "refinery"
version = "0.1.0"
description = "Refinery Lakehouse: shared Python code for the EIA petroleum pipelines"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pyspark>=4.2.1,<4.3",
    "ruff",
]
producer = [
    "databricks-zerobus-ingest-sdk>=1.11,<2",
    "protobuf>=5",
    "grpcio-tools>=1.66",
    "websockets>=13",
]

[tool.uv]
default-groups = ["dev", "producer"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refinery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
extend-exclude = ["*_pb2.py", "*_pb2.pyi"]
