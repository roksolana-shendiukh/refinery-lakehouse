[project]
name = "refinery"
version = "0.1.0"
description = "Refinery Lakehouse: shared Python code for the EIA petroleum pipelines"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "databricks-labs-dqx>=0.17.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pyspark>=4.2.1,<4.3",
    "ruff",
]
producer = [
    "databricks-zerobus-ingest-sdk>=1.11,<2",
    "protobuf>=5",
    "grpcio-tools>=1.66",
    "websockets>=17.4",
]
app = [
    "dash>=4.5,<5",
    "dash-leaflet>=1.1,<2",
    "gunicorn>=27.0.1",
    "databricks-sql-connector>=4",
    "databricks-sdk",
    "pandas",
    "openai>=3.57.0",
]

[tool.uv]
default-groups = ["dev", "producer", "app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refinery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "src/apps/live_map", "src/apps/assistant"]

[tool.ruff]
line-length = 120
extend-exclude = ["*_pb2.py", "*_pb2.pyi"]
builtins = ["spark"]
