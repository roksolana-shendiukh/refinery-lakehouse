[project]
name = "refinery"
version = "0.1.0"
description = "Refinery Lakehouse: shared Python code for the EIA petroleum pipelines"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pyspark>=4.0,<4.1",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refinery"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120