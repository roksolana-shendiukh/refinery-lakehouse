command: ["gunicorn", "app:server", "--config", "gunicorn.conf.py"]

env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: LIVE_TANKERS_TABLE
    value: dbr_dev_ua5816bd.refinery_live.live_tankers
  - name: LIVE_TERMINALS_TABLE
    value: dbr_dev_ua5816bd.refinery_live.live_terminal_congestion
  - name: LIVE_ZONES_TABLE
    value: dbr_dev_ua5816bd.refinery_live.live_terminal_zone
  - name: REFRESH_SECONDS
    value: "15"
  - name: ZONES_REFRESH_SECONDS
    value: "3600"
  - name: FRESH_MINUTES
    value: "10"
  - name: MAP_TILE_URL
    value: "https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png?key={api_key}"
  - name: MAP_TILE_KEY
    valueFrom: carto-key
  - name: MAP_TILE_ATTRIBUTION
    value: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
