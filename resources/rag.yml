# RAG assistant: EIA articles from bronze to search-ready chunks in the rag schema.
resources:
  jobs:
    rag_index:
      name: refinery-rag-index

      parameters:
        - name: landing_path
          default: /Volumes/${var.catalog}/${resources.schemas.bronze.name}/${resources.volumes.landing.name}

      tasks:
        - task_key: fetch_articles
          environment_key: default
          timeout_seconds: 3600
          spark_python_task:
            python_file: ../src/ingestion/fetch_eia_articles.py
            parameters:
              - --landing-path
              - "{{job.parameters.landing_path}}"
        - task_key: refresh_bronze
          depends_on:
            - task_key: fetch_articles
          pipeline_task:
            pipeline_id: ${resources.pipelines.rag_bronze.id}
        - task_key: clean_articles
          depends_on:
            - task_key: refresh_bronze
          environment_key: default
          spark_python_task:
            python_file: ../src/ingestion/clean_eia_articles.py
            parameters:
              - --bronze-table
              - ${var.catalog}.${resources.schemas.bronze.name}.eia_articles_raw
              - --silver-table
              - ${var.catalog}.${resources.schemas.silver.name}.eia_articles
              - --quarantine-table
              - ${var.catalog}.${resources.schemas.quality.name}.eia_articles_quarantine
        - task_key: chunk_articles
          depends_on:
            - task_key: clean_articles
          environment_key: default
          spark_python_task:
            python_file: ../src/ingestion/chunk_eia_articles.py
            parameters:
              - --silver-table
              - ${var.catalog}.${resources.schemas.silver.name}.eia_articles
              - --chunks-table
              - ${var.catalog}.${resources.schemas.rag.name}.eia_article_chunks
        - task_key: sync_search
          depends_on:
            - task_key: chunk_articles
          environment_key: default
          spark_python_task:
            python_file: ../src/ingestion/vector_search.py
            parameters:
              - sync
              - --chunks-table
              - ${var.catalog}.${resources.schemas.rag.name}.eia_article_chunks
              - --index-name
              - ${var.catalog}.${resources.schemas.rag.name}.eia_article_chunks_index

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl

    rag_search_start:
      name: refinery-rag-search-start

      tasks:
        - task_key: start_search
          environment_key: default
          # Endpoint (up to 30 min) and the first sync of the index (up to 45 min)
          timeout_seconds: 5400
          spark_python_task:
            python_file: ../src/ingestion/vector_search.py
            parameters:
              - start
              - --chunks-table
              - ${var.catalog}.${resources.schemas.rag.name}.eia_article_chunks
              - --index-name
              - ${var.catalog}.${resources.schemas.rag.name}.eia_article_chunks_index
              - --reader-app
              - refinery-assistant

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl

    rag_search_stop:
      name: refinery-rag-search-stop

      tasks:
        - task_key: stop_search
          environment_key: default
          spark_python_task:
            python_file: ../src/ingestion/vector_search.py
            parameters:
              - stop
              - --chunks-table
              - ${var.catalog}.${resources.schemas.rag.name}.eia_article_chunks
              - --index-name
              - ${var.catalog}.${resources.schemas.rag.name}.eia_article_chunks_index

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl

    rag_eval:
      name: refinery-rag-eval

      tasks:
        - task_key: evaluate
          environment_key: eval
          timeout_seconds: 3600
          spark_python_task:
            python_file: ../src/apps/assistant/evaluate.py
            parameters:
              - --app-dir
              - ${workspace.file_path}/src/apps/assistant
              - --questions
              - ${workspace.file_path}/data/rag/eval_questions.json
              - --index-name
              - ${var.catalog}.${resources.schemas.rag.name}.eia_article_chunks_index
              # The model of the assistant app (apps.assistant serving-endpoint)
              - --llm-endpoint
              - databricks-meta-llama-3-3-70b-instruct
              - --experiment
              - ${resources.experiments.rag_eval_experiment.name}
              - --judge-model
              - ${var.eval_judge_model}

      # The assistant package comes from the source folder, not the wheel; MLflow is part of the environment
      environments:
        - environment_key: eval
          spec:
            environment_version: "5"
            dependencies:
              - openai>=3.57
              - databricks-sdk>=0.166

  pipelines:
    rag_bronze:
      name: refinery-rag-bronze
      catalog: ${var.catalog}
      schema: ${resources.schemas.bronze.name}
      serverless: true
      root_path: ../src/refinery_bronze

      libraries:
        - file:
            path: ../src/refinery_bronze/rag/eia_articles_raw.py

      environment:
        dependencies:
          - ../dist/*.whl

      configuration:
        refinery.landing_path: /Volumes/${var.catalog}/${resources.schemas.bronze.name}/${resources.volumes.landing.name}

  experiments:
    rag_eval_experiment:
      name: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/refinery-rag-eval

# The assistant app runs only in PROD: the bundle's app config cannot take
# per-target values, so app.yaml holds the PROD names. In DEV the app is run locally.
targets:
  prod:
    resources:
      apps:
        assistant:
          name: refinery-assistant
          description: Answers petroleum market questions from EIA articles and the Short-Term Energy Outlook
          source_code_path: ../src/apps/assistant
          resources:
            - name: sql-warehouse
              description: SQL warehouse that writes the request log
              sql_warehouse:
                id: ${var.warehouse_id}
                permission: CAN_USE
            - name: serving-endpoint
              description: Model that answers the questions
              serving_endpoint:
                name: databricks-meta-llama-3-3-70b-instruct
                permission: CAN_QUERY

          permissions:
            - level: CAN_MANAGE
              user_name: ${var.operator_user}
            - level: CAN_USE
              group_name: refinery_market_analysts
            - level: CAN_USE
              group_name: refinery_region_R30
            - level: CAN_USE
              group_name: refinery_data_engineers
      # Results are readable by the analysts and engineers who use the assistant
      experiments:
        rag_eval_experiment:
          permissions:
            - level: CAN_MANAGE
              user_name: ${var.operator_user}
            - level: CAN_READ
              group_name: refinery_market_analysts
            - level: CAN_READ
              group_name: refinery_data_engineers
