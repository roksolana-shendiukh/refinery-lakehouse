resources:
  schemas:
    bronze:
      catalog_name: ${var.catalog}
      name: ${var.schema_prefix}bronze
      comment: Raw data as ingested (EIA, reference data, AIS landing table), append-only
    silver:
      catalog_name: ${var.catalog}
      name: ${var.schema_prefix}silver
      comment: Cleaned and validated data, quarantine tables
    gold:
      catalog_name: ${var.catalog}
      name: ${var.schema_prefix}gold
      comment: Star schema for analytics, filtered and masked by access policy
    security:
      catalog_name: ${var.catalog}
      name: ${var.schema_prefix}security
      comment: Access policy table, row filter and column mask functions
    live:
      catalog_name: ${var.catalog}
      name: ${var.schema_prefix}live
      comment: Live AIS serving tables for the live map (current position and static data per ship)
