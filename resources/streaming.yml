# Live AIS path. The landing table itself is infrastructure (infra/landing_table.tf, Terraform).
# Zerobus runs in PROD only, so everything that reads it exists only in the prod target.
# The live pipeline is triggered by default: deploys never start it, so it cannot be left running.
# Switch to continuous: true only for a demo (a PR before, a PR back after).
targets:
  prod:
    resources:
      alerts:
        ais_landing_freshness:
          display_name: "Refinery: AIS landing table freshness"
          custom_summary: "AIS landing table: {{QUERY_RESULT_VALUE}} minutes without new data"
          custom_description: >-
            The AIS producer has not written to zerobus_ais_messages for more than 20 minutes.
            Check that the producer is running and look at its last heartbeat log line.
          query_text: >-
            SELECT coalesce(timestampdiff(MINUTE, max(received_at), current_timestamp()), 9999)
              AS minutes_since_last_row
            FROM ${var.catalog}.${resources.schemas.bronze.name}.zerobus_ais_messages
          warehouse_id: ${var.warehouse_id}
          evaluation:
            source:
              name: minutes_since_last_row
              display: minutes_since_last_row
            comparison_operator: GREATER_THAN
            threshold:
              value:
                double_value: 20
            empty_result_state: TRIGGERED
            notification:
              notify_on_ok: false
              retrigger_seconds: 0
              subscriptions:
                - user_email: ${var.alert_email}
          schedule:
            quartz_cron_schedule: "0 3/15 * * * ?"
            timezone_id: UTC
            pause_status: UNPAUSED
          run_as:
            service_principal_name: ${var.prod_service_principal}
          permissions:
            - level: CAN_MANAGE
              user_name: ${var.alert_email}

      pipelines:
        ais_live:
          name: refinery-ais-live
          catalog: ${var.catalog}
          schema: ${resources.schemas.live.name}
          serverless: true
          continuous: false
          channel: CURRENT
          configuration:
            source_table: ${var.catalog}.${resources.schemas.bronze.name}.zerobus_ais_messages
            # A tanker slower than this (knots) counts as waiting.
            stationary_speed_knots: "0.5"
            # Tankers waiting in a zone for the congestion levels high and elevated.
            congestion_high_waiting: "7"
            congestion_elevated_waiting: "3"
          libraries:
            - file:
                path: ../src/refinery/live/live_vessel_position.sql
            - file:
                path: ../src/refinery/live/live_vessel_info.sql
            # Generated from data/reference by scripts/generate_live_reference.py
            - file:
                path: ../src/refinery/live/live_ref_terminal_zone.sql
            - file:
                path: ../src/refinery/live/live_ref_mid.sql
            - file:
                path: ../src/refinery/live/live_terminal_zone.sql
            - file:
                path: ../src/refinery/live/live_tankers.sql
            - file:
                path: ../src/refinery/live/live_terminal_congestion.sql
          permissions:
            - level: CAN_MANAGE
              user_name: ${var.operator_user}

      apps:
        live_map:
          name: refinery-live-map
          description: Live map of tankers on the U.S. coasts, from refinery_live.live_tankers
          source_code_path: ../src/apps/live_map
          resources:
            - name: sql-warehouse
              description: SQL warehouse for the live_tankers query
              sql_warehouse:
                id: ${var.warehouse_id}
                permission: CAN_USE
          permissions:
            - level: CAN_MANAGE
              user_name: ${var.operator_user}
            - level: CAN_USE
              group_name: users
