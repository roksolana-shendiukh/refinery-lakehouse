# Batch path: weekly EIA supply and prices, landed as JSON files, read by bronze, then silver, gold and its access policies.  
resources:
  volumes:
    landing:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.bronze.name}
      name: landing
      comment: Raw EIA API responses as JSON Lines, one folder per load (load_id)

  jobs:
    eia_ingest:
      name: refinery-eia-ingest

      schedule:
        quartz_cron_expression: "0 0 6 ? * THU"
        timezone_id: UTC
        pause_status: UNPAUSED

      parameters:
        - name: landing_path
          default: /Volumes/${var.catalog}/${resources.schemas.bronze.name}/${resources.volumes.landing.name}
        - name: reference_path
          default: ${workspace.file_path}/data/reference
        - name: secret_scope
          default: ${var.secret_scope}

      tasks:
        - task_key: fetch_eia
          environment_key: default
          timeout_seconds: 3600
          spark_python_task:
            python_file: ../src/ingestion/fetch_eia.py
            parameters:
              - --landing-path
              - "{{job.parameters.landing_path}}"
              - --reference-path
              - "{{job.parameters.reference_path}}"
              - --secret-scope
              - "{{job.parameters.secret_scope}}"
        - task_key: refresh_bronze
          depends_on:
            - task_key: fetch_eia
          pipeline_task:
            pipeline_id: ${resources.pipelines.eia_bronze.id}
        - task_key: refresh_silver
          depends_on:
            - task_key: refresh_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver_batch.id}
        - task_key: save_dq_metrics
          depends_on:
            - task_key: refresh_silver
          environment_key: default
          spark_python_task:
            python_file: ../src/refinery_silver/save_dq_metrics.py
            parameters:
              - --latest
              - ${var.catalog}.${resources.schemas.quality.name}.dq_summary_metrics_latest
              - --history
              - ${var.catalog}.${resources.schemas.quality.name}.dq_summary_metrics
        - task_key: refresh_gold
          depends_on:
            - task_key: refresh_silver
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_batch.id}
        - task_key: apply_gold_policies
          depends_on:
            - task_key: refresh_gold
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../governance/gold_abac.sql
            parameters:
              catalog: ${var.catalog}
              gold_schema: ${resources.schemas.gold.name}

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl

  pipelines:
    eia_bronze:
      name: refinery-eia-bronze
      catalog: ${var.catalog}
      schema: ${resources.schemas.bronze.name}
      serverless: true
      root_path: ../src/refinery_bronze

      libraries:
        - glob:
            include: ../src/refinery_bronze/transformations/**

      environment:
        dependencies:
          - ../dist/*.whl

      configuration:
        refinery.landing_path: /Volumes/${var.catalog}/${resources.schemas.bronze.name}/${resources.volumes.landing.name}
